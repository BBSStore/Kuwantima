name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Kuwantima/Kuwantima.csproj -c Release

      - name: Pack
        run: dotnet pack Kuwantima/Kuwantima.csproj -c Release --no-build

      - name: Publish to NuGet
        run: dotnet nuget push Kuwantima/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
